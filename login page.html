<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Bus Route Tracking - Driver Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #cfe0f5 0%, #dbe8f7 40%, #eaf1fa 100%);
    padding: 24px;
  }

  .page {
    position: relative;
    width: 100%;
    max-width: 460px;
    min-height: 700px;
    border-radius: 28px;
    overflow: hidden;
    background: linear-gradient(180deg, #a9c6ea 0%, #c3d8f0 35%, #dde9f7 65%, #eef4fb 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 32px 0;
  }

  .skyline {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 260px;
    z-index: 0;
    opacity: 0.5;
  }

  .icon-badge {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(30, 64, 130, 0.15);
    margin-bottom: 20px;
    z-index: 1;
  }

  .icon-badge svg {
    width: 40px;
    height: 40px;
    color: #1e3a8a;
  }

  h1.title {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #1e3a8a;
    line-height: 1.25;
    z-index: 1;
  }

  .subtitle {
    text-align: center;
    color: #5b6b82;
    font-size: 15px;
    margin-top: 8px;
    margin-bottom: 28px;
    z-index: 1;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 28px 26px 26px;
    box-shadow: 0 20px 40px rgba(30, 64, 130, 0.18);
    z-index: 1;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
  }

  .card-header svg {
    width: 22px;
    height: 22px;
    color: #2563eb;
  }

  .card-header h2 {
    font-size: 19px;
    font-weight: 700;
    color: #16213e;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #1f2937;
    margin-bottom: 6px;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap svg.leading-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: #9aa5b1;
    pointer-events: none;
  }

  .input-wrap input {
    width: 100%;
    padding: 12px 14px 12px 38px;
    border: 1px solid #e2e6ec;
    border-radius: 10px;
    font-size: 14px;
    color: #1f2937;
    background: #fafbfc;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-wrap input::placeholder {
    color: #a6afba;
  }

  .input-wrap input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    background: #ffffff;
  }

  .toggle-visibility {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: #9aa5b1;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 20px;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #4b5563;
  }

  .remember input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #2563eb;
    cursor: pointer;
  }

  .forgot {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .forgot:hover {
    text-decoration: underline;
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(180deg, #2f6fed 0%, #2352c9 100%);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  .login-btn:hover {
    filter: brightness(1.05);
  }

  .login-btn:active {
    transform: translateY(1px);
  }

  .secure-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    font-size: 12px;
    color: #8b95a3;
  }

  .secure-note svg {
    width: 13px;
    height: 13px;
  }

  @media (max-width: 480px) {
    .page {
      min-height: 100vh;
      border-radius: 0;
    }
  }
</style>
</head>
<body>

<div class="page">

  <svg class="skyline" viewBox="0 0 460 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="120" width="40" height="140" fill="#7ea3d6"/>
    <rect x="45" y="90" width="35" height="170" fill="#8bb0dd"/>
    <rect x="85" y="140" width="30" height="120" fill="#7ea3d6"/>
    <rect x="360" y="100" width="35" height="160" fill="#8bb0dd"/>
    <rect x="400" y="130" width="30" height="130" fill="#7ea3d6"/>
    <rect x="420" y="80" width="40" height="180" fill="#8bb0dd"/>
  </svg>

  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="3" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 12H20" stroke="currentColor" stroke-width="1.8"/>
      <path d="M7 21V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M17 21V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="8" cy="14.5" r="1.1" fill="currentColor"/>
      <circle cx="16" cy="14.5" r="1.1" fill="currentColor"/>
      <path d="M8 7H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 class="title">Employee Bus<br>Route Tracking</h1>
  <p class="subtitle">Driver Login</p>

  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" fill="currentColor"/>
        <path d="M4 20C4 16.134 7.582 13 12 13C16.418 13 20 16.134 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <h2>Driver Login</h2>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="driverId">Driver ID</label>
        <div class="input-wrap">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M5 19.5C5 16.462 8.134 14 12 14C15.866 14 19 16.462 19 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="text" id="driverId" name="driverId" placeholder="Enter Driver ID" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="10" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 10V7.5C8 5.567 9.567 4 11.5 4H12.5C14.433 4 16 5.567 16 7.5V10" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter Password" autocomplete="current-password" required>
          <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              <line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="1.6" id="slash" style="display:none;"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot" id="forgotPw">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="secure-note">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L4 6V11C4 16 7.5 20.5 12 22C16.5 20.5 20 16 20 11V6L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      Secure login for authorized drivers only
    </div>
  </div>

</div>

<script>
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  const slash = document.getElementById('slash');

  toggleBtn.addEventListener('click', () => {
    const isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    slash.style.display = isPassword ? 'block' : 'none';
    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const driverId = document.getElementById('driverId').value.trim();
    const password = pwInput.value;

    if (!driverId || !password) {
      alert('Please enter both Driver ID and Password.');
      return;
    }

    console.log('Login attempt:', { driverId, remember: document.getElementById('rememberMe').checked });
    alert('Login submitted (connect this to your backend).');
  });

  document.getElementById('forgotPw').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Forgot password flow goes here.');
  });
</script>

</body>
</html>
