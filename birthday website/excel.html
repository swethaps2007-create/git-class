<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Schedule</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            padding: 40px;
        }

        .page {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        .title {
            font-size: 25px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 25px;
        }

        .table-box {
            width: 100%;
            border: 1px solid #d9dee5;
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3f6fa;
            color: #4b5563;
            text-align: left;
            font-size: 13px;
            padding: 16px;
            border-bottom: 1px solid #d9dee5;
        }

        td {
            height: 55px;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="title">
            Trip Schedule
        </div>

        <div class="table-box">

            <table id="tripTable">

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Driver Name</th>
                        <th>Phone Number</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                    </tr>
                </thead>

                <tbody id="tripTableBody">
                    <!-- Data will be automatically added here later -->
                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
