<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authority Profile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #eef1f5;
    display: flex;
    justify-content: center;
}

/* Main App */
.app {
    width: 540px;
    min-height: 100vh;
    background: white;
    position: relative;
    overflow: hidden;
}

/* Top Header */
.header {
    height: 60px;
    background: #0751b9;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 18px;
    font-weight: bold;
}

.back {
    font-size: 30px;
    margin-right: 25px;
    cursor: pointer;
}

/* Profile Background */
.profile-bg {
    height: 140px;
    background-color: #edf6ff;

    background-image:
        radial-gradient(#dcecff 3px, transparent 3px);

    background-size: 35px 35px;
}

/* Profile Section */
.profile-section {
    text-align: center;
    position: relative;
    margin-top: -75px;
}

.profile-pic {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid white;
}

.camera {
    position: absolute;
    right: 150px;
    bottom: 25px;

    width: 38px;
    height: 38px;
    border-radius: 50%;

    background: #0751b9;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 3px solid white;
    font-size: 17px;
}

.profile-name {
    margin-top: -2px;
    font-size: 18px;
    font-weight: bold;
}

.email {
    margin-top: 7px;
    color: #666;
    font-size: 14px;
}

.role {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 13px;
    background: #e8f0ff;
    color: #0751b9;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
}

/* Profile Options */
.options {
    margin: 28px 16px 20px;
    border: 1px solid #ddd;
    border-radius: 11px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.option {
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    border-bottom: 1px solid #e5e5e5;
}

.option:last-child {
    border-bottom: none;
}

.icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #edf4ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    margin-right: 14px;
}

.option-text {
    flex: 1;
}

.option-title {
    font-size: 16px;
    font-weight: bold;
    color: #111;
}

/* Only used for rows that have subtitle */
.option-subtitle {
    font-size: 13px;
    color: #666;
    margin-top: 4px;
}

.arrow {
    font-size: 27px;
    color: #777;
}

/* Logout */
.logout {
    margin: 20px 16px;
    height: 58px;

    border: 1px solid #ddd;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: red;
    font-weight: bold;

    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

/* Bottom Navigation */
.bottom-nav {
    position: fixed;
    bottom: 0;

    width: 540px;
    height: 75px;

    background: white;
    border-top: 1px solid #ddd;

    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav-item {
    text-align: center;
    color: #777;
    font-size: 12px;
    cursor: pointer;
}

.nav-icon {
    font-size: 21px;
    margin-bottom: 5px;
}

.nav-item.active {
    color: #0751b9;
    font-weight: bold;
}

/* Mobile */
@media (max-width: 540px) {

    .app {
        width: 100%;
    }

    .bottom-nav {
        width: 100%;
    }

    .camera {
        right: 27%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">
        <div class="back">←</div>
        Authority Profile
    </div>

    <!-- Background -->
    <div class="profile-bg"></div>

    <!-- Profile -->
    <div class="profile-section">

        <img
            src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=300&q=80"
            class="profile-pic"
        >

        <div class="camera">📷</div>

        <div class="profile-name">
            Admin User
        </div>

        <div class="email">
            admin@company.com
        </div>

        <div class="role">
            Authority
        </div>

    </div>


    <!-- Profile Options -->
    <div class="options">

        <!-- Profile Photo -->
        <div class="option">

            <div class="icon">👤</div>

            <div class="option-text">
                <div class="option-title">
                    Profile Photo
                </div>
            </div>

            <div class="arrow">
                ›
            </div>

        </div>


        <!-- Name -->
        <div class="option">

            <div class="icon">♙</div>

            <div class="option-text">

                <div class="option-title">
                    Name
                </div>

                <div class="option-subtitle">
                    Admin User
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>


        <!-- Email -->
        <div class="option">

            <div class="icon">✉</div>

            <div class="option-text">

                <div class="option-title">
                    Email
                </div>

                <div class="option-subtitle">
                    admin@company.com
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>


        <!-- Password -->
        <div class="option">

            <div class="icon">🔒</div>

            <div class="option-text">

                <div class="option-title">
                    Forgot Password
                </div>

                <div class="option-subtitle">
                    Reset your password
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>


        <!-- Phone -->
        <div class="option">

            <div class="icon">☎</div>

            <div class="option-text">

                <div class="option-title">
                    Phone Number
                </div>

                <div class="option-subtitle">
                    +91 98765 43210
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>

    </div>


    <!-- Logout -->
    <div class="logout">
        ⇥ &nbsp; Logout
    </div>


    <!-- Bottom Navigation -->
    <div class="bottom-nav">

        <!-- Dashboard -->
        <div class="nav-item">
            <div class="nav-icon">▦</div>
            Dashboard
        </div>

        <!-- Route -->
        <div class="nav-item">
            <div class="nav-icon">🚌</div>
            Route
        </div>

        <!-- Reports REMOVED -->

        <!-- Alerts -->
        <div class="nav-item">
            <div class="nav-icon">♧</div>
            Alerts
        </div>

        <!-- Profile -->
        <div class="nav-item active">
            <div class="nav-icon">●</div>
            Profile
        </div>

    </div>

</div>

</body>
</html>
