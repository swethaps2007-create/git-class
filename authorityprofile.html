<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authority Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #202124;
        }


        /* =================================
           MAIN MOBILE CONTAINER
        ================================= */

        .mobile-screen {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;

            margin: auto;

            background: #ffffff;

            position: relative;

            padding-bottom: 75px;

            overflow: hidden;
        }


        /* =================================
           TOP BLUE HEADER
        ================================= */

        .top-header {
            height: 42px;

            background: #0645b5;

            color: white;

            display: flex;

            align-items: center;

            padding: 0 14px;

            position: relative;

            z-index: 10;
        }


        .back-arrow {
            font-size: 25px;

            font-weight: 300;

            margin-right: 20px;

            cursor: pointer;

            line-height: 1;
        }


        .top-header h2 {
            font-size: 14px;

            font-weight: 600;
        }


        /* =================================
           COVER / BACKGROUND
        ================================= */

        .cover {
            height: 113px;

            background-color: #eef6ff;

            position: relative;

            /*
               Light decorative pattern
            */
            background-image:
                radial-gradient(
                    circle at 15% 25%,
                    rgba(0, 70, 180, 0.05) 2px,
                    transparent 3px
                );

            background-size: 28px 28px;
        }


        /* =================================
           PROFILE SECTION
        ================================= */

        .profile-section {
            height: 105px;

            text-align: center;

            position: relative;

            background: white;
        }


        /* =================================
           PROFILE IMAGE
        ================================= */

        .profile-photo {
            width: 108px;

            height: 108px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid white;

            position: absolute;

            top: -58px;

            left: 50%;

            transform: translateX(-50%);

            background: #eeeeee;

            box-shadow:
                0 1px 5px rgba(0,0,0,0.15);

            z-index: 5;
        }


        /* =================================
           CAMERA BUTTON
        ================================= */

        .camera-button {
            width: 32px;

            height: 32px;

            border-radius: 50%;

            background: #0750bd;

            border: 3px solid white;

            color: white;

            position: absolute;

            top: 1px;

            left: calc(50% + 39px);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;

            z-index: 8;

            cursor: pointer;
        }


        /* =================================
           NAME
        ================================= */

        .profile-name {
            padding-top: 17px;

            font-size: 18px;

            font-weight: 700;

            color: #161616;
        }


        /* =================================
           EMAIL
        ================================= */

        .profile-email {
            margin-top: 7px;

            font-size: 12px;

            color: #777777;
        }


        /* =================================
           AUTHORITY BADGE
        ================================= */

        .authority-badge {
            display: inline-block;

            margin-top: 7px;

            padding: 4px 10px;

            border-radius: 12px;

            background: #e6efff;

            color: #0750bd;

            font-size: 11px;

            font-weight: 600;
        }


        /* =================================
           PROFILE DETAILS CARD
        ================================= */

        .details-card {

            margin: 3px 12px 0;

            border: 1px solid #e5e5e5;

            border-radius: 8px;

            overflow: hidden;

            background: white;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.06);
        }


        /* =================================
           DETAIL ROW
        ================================= */

        .detail-row {

            height: 58px;

            display: flex;

            align-items: center;

            padding: 7px 12px;

            border-bottom: 1px solid #eeeeee;

            cursor: pointer;

            transition: background 0.2s;
        }


        .detail-row:last-child {
            border-bottom: none;
        }


        .detail-row:hover {
            background: #f8fbff;
        }


        /* =================================
           ICON CIRCLE
        ================================= */

        .icon-circle {

            width: 34px;

            height: 34px;

            min-width: 34px;

            border-radius: 50%;

            background: #eaf2ff;

            color: #0750bd;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;

            margin-right: 11px;
        }


        /* =================================
           DETAIL TEXT
        ================================= */

        .detail-text {

            flex: 1;

            text-align: left;
        }


        .detail-title {

            font-size: 12px;

            font-weight: 700;

            color: #252525;

            margin-bottom: 4px;
        }


        .detail-value {

            font-size: 10px;

            color: #777777;
        }


        /* =================================
           RIGHT ARROW
        ================================= */

        .arrow {

            font-size: 23px;

            color: #777777;

            font-weight: 300;

            margin-left: 5px;
        }


        /* =================================
           LOGOUT BUTTON
        ================================= */

        .logout-button {

            height: 47px;

            margin: 15px 12px 0;

            border: 1px solid #e8e8e8;

            border-radius: 8px;

            background: white;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.06);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #e32626;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .logout-icon {

            font-size: 19px;

            margin-right: 7px;
        }


        .logout-button:hover {

            background: #fff7f7;
        }


        /* =================================
           BOTTOM NAVIGATION
        ================================= */

        .bottom-nav {

            position: fixed;

            bottom: 0;

            left: 50%;

            transform: translateX(-50%);

            width: 100%;

            max-width: 430px;

            height: 69px;

            background: white;

            border-top: 1px solid #eeeeee;

            display: flex;

            align-items: center;

            justify-content: space-around;

            z-index: 20;
        }


        /* =================================
           NAV ITEM
        ================================= */

        .nav-item {

            width: 20%;

            text-align: center;

            color: #888888;

            font-size: 9px;

            cursor: pointer;
        }


        .nav-icon {

            height: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 3px;

            font-size: 20px;
        }


        .nav-item.active {

            color: #0750bd;

            font-weight: 600;
        }


        .nav-item:hover {

            color: #0750bd;
        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (min-width: 600px) {

            body {
                background: #f1f3f6;
            }

            .mobile-screen {

                box-shadow:
                    0 0 18px rgba(0,0,0,0.10);
            }
        }

    </style>

</head>


<body>


<div class="mobile-screen">


    <!-- =================================
         HEADER
    ================================= -->

    <div class="top-header">

        <div
            class="back-arrow"
            onclick="goBack()"
        >
            ←
        </div>

        <h2>
            Authority Profile
        </h2>

    </div>



    <!-- =================================
         COVER
    ================================= -->

    <div class="cover"></div>



    <!-- =================================
         PROFILE
    ================================= -->

    <div class="profile-section">


        <!-- Profile Image -->

        <img
            id="profilePhoto"
            class="profile-photo"
            src="https://i.pravatar.cc/200?img=11"
            alt="Authority Profile"
        >


        <!-- Camera -->

        <div
            class="camera-button"
            onclick="changePhoto()"
        >
            📷
        </div>


        <!-- Name -->

        <div class="profile-name">
            Admin User
        </div>


        <!-- Email -->

        <div class="profile-email">
            admin@company.com
        </div>


        <!-- Authority Badge -->

        <div class="authority-badge">
            Authority
        </div>

    </div>



    <!-- =================================
         DETAILS CARD
    ================================= -->

    <div class="details-card">


        <!-- PROFILE PHOTO -->

        <div
            class="detail-row"
            onclick="changePhoto()"
        >

            <div class="icon-circle">
                👤
            </div>


            <div class="detail-text">

                <div class="detail-title">
                    Profile Photo
                </div>

                <div class="detail-value">
                    Tap to change profile photo
                </div>

            </div>


            <div class="arrow">
                ›
            </div>

        </div>



        <!-- NAME -->

        <div
            class="detail-row"
            onclick="editName()"
        >

            <div class="icon-circle">
                ♙
            </div>


            <div class="detail-text">

                <div class="detail-title">
                    Name
                </div>

                <div class="detail-value">
                    Admin User
                </div>

            </div>


            <div class="arrow">
                ›
            </div>

        </div>



        <!-- EMAIL -->

        <div
            class="detail-row"
            onclick="editEmail()"
        >

            <div class="icon-circle">
                ✉
            </div>


            <div class="detail-text">

                <div class="detail-title">
                    Email
                </div>

                <div class="detail-value">
                    admin@company.com
                </div>

            </div>


            <div class="arrow">
                ›
            </div>

        </div>



        <!-- FORGOT PASSWORD -->

        <div
            class="detail-row"
            onclick="forgotPassword()"
        >

            <div class="icon-circle">
                🔒
            </div>


            <div class="detail-text">

                <div class="detail-title">
                    Forgot Password
                </div>

                <div class="detail-value">
                    Reset your password
                </div>

            </div>


            <div class="arrow">
                ›
            </div>

        </div>



        <!-- PHONE NUMBER -->

        <div
            class="detail-row"
            onclick="editPhone()"
        >

            <div class="icon-circle">
                ☎
            </div>


            <div class="detail-text">

                <div class="detail-title">
                    Phone Number
                </div>

                <div class="detail-value">
                    +91 98765 43210
                </div>

            </div>


            <div class="arrow">
                ›
            </div>

        </div>

    </div>



    <!-- =================================
         LOGOUT
    ================================= -->

    <div
        class="logout-button"
        onclick="logout()"
    >

        <span class="logout-icon">
            ⇥
        </span>

        Logout

    </div>



    <!-- =================================
         BOTTOM NAVIGATION
    ================================= -->

    <div class="bottom-nav">


        <!-- Dashboard -->

        <div
            class="nav-item"
            onclick="navigate('dashboard')"
        >

            <div class="nav-icon">
                ▦
            </div>

            Dashboard

        </div>



        <!-- All Routes -->

        <div
            class="nav-item"
            onclick="navigate('routes')"
        >

            <div class="nav-icon">
                🚌
            </div>

            All Routes

        </div>



        <!-- Reports -->

        <div
            class="nav-item"
            onclick="navigate('reports')"
        >

            <div class="nav-icon">
                ▤
            </div>

            Reports

        </div>



        <!-- Alerts -->

        <div
            class="nav-item"
            onclick="navigate('alerts')"
        >

            <div class="nav-icon">
                ♧
            </div>

            Alerts

        </div>



        <!-- Profile -->

        <div class="nav-item active">

            <div class="nav-icon">
                ●
            </div>

            Profile

        </div>


    </div>


</div>



<script>


    /* =================================
       BACK BUTTON
    ================================= */

    function goBack() {

        if (window.history.length > 1) {

            window.history.back();

        } else {

            alert("Back button clicked");

        }

    }



    /* =================================
       CHANGE PROFILE PHOTO
    ================================= */

    function changePhoto() {

        const input =
            document.createElement("input");

        input.type = "file";

        input.accept = "image/*";


        input.onchange = function(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    document
                        .getElementById("profilePhoto")
                        .src = e.target.result;

                };


            reader.readAsDataURL(file);

        };


        input.click();

    }



    /* =================================
       EDIT NAME
    ================================= */

    function editName() {

        const newName =
            prompt(
                "Enter your name:",
                "Admin User"
            );


        if (
            newName &&
            newName.trim() !== ""
        ) {

            document
                .querySelector(".profile-name")
                .textContent =
                newName;


            /*
               Update name inside card
            */

            const rows =
                document.querySelectorAll(
                    ".detail-row"
                );


            rows[1]
                .querySelector(".detail-value")
                .textContent =
                newName;

        }

    }



    /* =================================
       EDIT EMAIL
    ================================= */

    function editEmail() {

        const newEmail =
            prompt(
                "Enter your email:",
                "admin@company.com"
            );


        if (
            newEmail &&
            newEmail.trim() !== ""
        ) {

            document
                .querySelectorAll(
                    ".detail-value"
                )[2]
                .textContent =
                newEmail;

        }

    }



    /* =================================
       EDIT PHONE
    ================================= */

    function editPhone() {

        const newPhone =
            prompt(
                "Enter your phone number:",
                "+91 98765 43210"
            );


        if (
            newPhone &&
            newPhone.trim() !== ""
        ) {

            document
                .querySelectorAll(
                    ".detail-value"
                )[4]
                .textContent =
                newPhone;

        }

    }



    /* =================================
       FORGOT PASSWORD
    ================================= */

    function forgotPassword() {

        alert(
            "Password reset instructions will be sent to your registered email."
        );

    }



    /* =================================
       LOGOUT
    ================================= */

    function logout() {

        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if (confirmLogout) {

            alert(
                "Logged out successfully."
            );

        }

    }



    /* =================================
       BOTTOM NAVIGATION
    ================================= */

    function navigate(page) {

        if (page === "dashboard") {

            alert("Opening Dashboard");

        }

        else if (page === "routes") {

            alert("Opening All Routes");

        }

        else if (page === "reports") {

            alert("Opening Reports");

        }

        else if (page === "alerts") {

            alert("Opening Alerts");

        }

    }

</script>


</body>
</html>
